<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Drama Motivation Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0F;
    --surface: #12121C;
    --surface-2: #181826;
    --green: #39FF88;
    --green-dim: #1F8A4D;
    --orange: #FF6B2C;
    --text: #E8E6F0;
    --text-dim: #6B6878;
    --border: #232233;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: radial-gradient(circle at 20% 0%, #14141f 0%, #0A0A0F 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 28px 16px 40px;
    overflow-x: hidden;
  }

  /* ---------- BACKGROUND VIDEO ---------- */
  .video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
  }

  .video-bg video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.35) saturate(1.1);
  }

  .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 0%, rgba(20,20,31,0.75) 0%, rgba(10,10,15,0.88) 55%);
    z-index: 1;
  }

  /* ---------- CONTAINER ---------- */
  .container {
    max-width: 750px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  /* ---------- USER SETUP SCREEN ---------- */
  .user-setup {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 0%, rgba(20,20,31,0.95) 0%, rgba(10,10,15,0.98) 55%);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .user-setup.active {
    display: flex;
  }

  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }

  .setup-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 36px;
    font-weight: 800;
    margin: 0 0 12px;
    background: linear-gradient(180deg, #ffffff 0%, var(--green) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .setup-subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .setup-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }

  .setup-input:focus-visible {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(57, 255, 136, 0.2);
  }

  .setup-btn {
    width: 100%;
    background: var(--green);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    transition: filter 0.15s;
    margin-top: 12px;
  }

  .setup-btn:hover { filter: brightness(1.1); }

  /* ---------- MAIN APP ---------- */
  .app {
    display: none;
  }

  .app.active {
    display: block;
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green-dim), var(--green));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--bg);
    font-size: 18px;
    box-shadow: 0 0 16px rgba(57, 255, 136, 0.4);
  }

  .user-label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .user-name {
    font-size: 16px;
    color: var(--text);
    font-weight: 700;
  }

  .logout-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
  }

  .logout-btn:hover {
    border-color: var(--green);
    color: var(--green);
  }

  /* ---------- MAIN CONTENT ---------- */
  .content-card {
    background: rgba(18, 18, 28, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    margin-bottom: 24px;
    text-align: center;
  }

  .main-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 48px;
    font-weight: 800;
    margin: 0 0 12px;
    background: linear-gradient(180deg, #ffffff 0%, var(--green) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 16px;
    color: var(--text-dim);
    margin: 0;
    font-weight: 500;
  }

  /* ---------- VIDEOS GRID ---------- */
  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text);
    margin: 28px 0 16px;
    letter-spacing: 0.05em;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }

  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .video-card:hover {
    border-color: var(--green);
    transform: translateY(-6px);
    box-shadow: 0 8px 24px rgba(57, 255, 136, 0.25);
  }

  .video-thumbnail {
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    position: relative;
  }

  .play-icon {
    position: absolute;
    font-size: 36px;
    opacity: 0.8;
    transition: opacity 0.3s;
  }

  .video-card:hover .play-icon {
    opacity: 1;
  }

  .video-info {
    padding: 12px;
  }

  .video-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 4px;
    line-height: 1.3;
  }

  .video-duration {
    font-size: 11px;
    color: var(--text-dim);
    margin: 0;
  }

  /* ---------- VIDEO MODAL ---------- */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.95);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    position: relative;
    width: 100%;
    max-width: 900px;
  }

  .modal-close {
    position: absolute;
    top: -40px;
    right: 0;
    background: none;
    border: none;
    color: var(--text);
    font-size: 32px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }

  .modal-close:hover {
    color: var(--green);
  }

  .modal-video {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 12px;
    box-shadow: 0 16px 48px rgba(57, 255, 136, 0.3);
  }

  .modal-info {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 20px;
  }

  .modal-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
    color: var(--text);
  }

  .modal-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    line-height: 1.5;
  }

  .favorite-btn {
    background: var(--green);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    margin-top: 12px;
    transition: filter 0.15s;
  }

  .favorite-btn:hover {
    filter: brightness(1.1);
  }

  .favorite-btn.favorited {
    background: var(--orange);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 768px) {
    .content-card {
      padding: 28px 20px;
    }

    .main-title {
      font-size: 36px;
    }

    .video-grid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    }

    .modal-content {
      max-width: 95vw;
    }
  }

  @media (max-width: 480px) {
    .header {
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    .main-title {
      font-size: 32px;
    }

    .video-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .modal-close {
      top: 10px;
      right: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- BACKGROUND VIDEO -->
<div class="video-bg">
  <video autoplay muted loop playsinline>
    <source src="https://media.giphy.com/media/l0HlRnAQ7ryPCQtDm/giphy.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>
</div>

<!-- USER SETUP SCREEN -->
<div class="user-setup" id="user-setup">
  <div class="setup-card">
    <h1 class="setup-title">💪 K-Study</h1>
    <p class="setup-subtitle">Stay motivated to study</p>
    <input type="text" class="setup-input" id="setup-name-input" placeholder="Your name..." maxlength="30">
    <button class="setup-btn" id="setup-start-btn">Get Motivated</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="app">
  <div class="container">
    <div class="header">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-label">Welcome</div>
          <div class="user-name" id="user-name">User</div>
        </div>
      </div>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>

    <div class="content-card">
      <h1 class="main-title">K-Drama Study Motivation</h1>
      <p class="subtitle">Watch inspiring scenes to stay focused on your goals</p>
    </div>

    <h2 class="section-title">Motivation Videos</h2>
    <div class="video-grid" id="video-grid">
      <!-- Videos will be loaded here -->
    </div>

    <h2 class="section-title">Your Saved Videos</h2>
    <div class="video-grid" id="saved-grid">
      <!-- Saved videos will be loaded here -->
    </div>
  </div>
</div>

<!-- VIDEO MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="modal-close" id="modal-close">✕</button>
    <video class="modal-video" id="modal-video" controls>
      <source src="" type="video/mp4">
    </video>
    <div class="modal-info">
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-desc" id="modal-desc"></p>
      <button class="favorite-btn" id="favorite-btn">Save Video</button>
    </div>
  </div>
</div>

<script>
  // Study motivation videos
  const VIDEOS = [
    {
      id: 1,
      title: "Never Give Up",
      emoji: "🔥",
      duration: "3:45",
      videoUrl: "https://media.giphy.com/media/l0HlF7yLJmVo0XO1i/giphy.mp4",
      desc: "Powerful scenes showing characters overcoming impossible odds through determination and hard work."
    },
    {
      id: 2,
      title: "Success Through Hard Work",
      emoji: "💼",
      duration: "4:20",
      videoUrl: "https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.mp4",
      desc: "Watch protagonists grinding towards their dreams with unwavering focus and commitment."
    },
    {
      id: 3,
      title: "Believe in Yourself",
      emoji: "⭐",
      duration: "3:15",
      videoUrl: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.mp4",
      desc: "Inspiring moments of characters discovering their inner strength and true potential."
    },
    {
      id: 4,
      title: "Rise and Grind",
      emoji: "🚀",
      duration: "5:00",
      videoUrl: "https://media.giphy.com/media/l0HlDtKo5lT1fL3a0/giphy.mp4",
      desc: "Epic training montages and moments of pure determination that will pump you up."
    },
    {
      id: 5,
      title: "Overcome Your Limits",
      emoji: "💪",
      duration: "4:10",
      videoUrl: "https://media.giphy.com/media/l0HlSY9x8FZo0XO1i/giphy.mp4",
      desc: "Characters pushing beyond their perceived limitations to achieve greatness."
    },
    {
      id: 6,
      title: "Keep Moving Forward",
      emoji: "🎯",
      duration: "3:50",
      videoUrl: "https://media.giphy.com/media/l0HlNaQ9ycJEfR2YU/giphy.mp4",
      desc: "Motivational scenes about persistence and taking consistent action toward goals."
    },
    {
      id: 7,
      title: "Passion & Purpose",
      emoji: "❤️",
      duration: "4:30",
      videoUrl: "https://media.giphy.com/media/l0HlE0dqAjsNuXfIM/giphy.mp4",
      desc: "Find your passion and purpose through these inspiring K-drama moments."
    },
    {
      id: 8,
      title: "Champion Mindset",
      emoji: "👑",
      duration: "3:25",
      videoUrl: "https://media.giphy.com/media/l0HlB7J8dD3vSKMIE/giphy.mp4",
      desc: "Develop a winner's mentality by watching champions conquer their challenges."
    }
  ];

  const USERS_STORAGE_KEY = 'k-study-users';
  const CURRENT_USER_KEY = 'k-study-current-user';

  // DOM Elements
  const userSetup = document.getElementById('user-setup');
  const app = document.getElementById('app');
  const setupNameInput = document.getElementById('setup-name-input');
  const setupStartBtn = document.getElementById('setup-start-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const videoGrid = document.getElementById('video-grid');
  const savedGrid = document.getElementById('saved-grid');
  const modal = document.getElementById('modal');
  const modalClose = document.getElementById('modal-close');
  const modalVideo = document.getElementById('modal-video');
  const modalTitle = document.getElementById('modal-title');
  const modalDesc = document.getElementById('modal-desc');
  const favoriteBtn = document.getElementById('favorite-btn');

  let currentUser = null;
  let currentVideoId = null;

  // Initialize app
  function init() {
    currentUser = loadCurrentUser();
    if (currentUser) {
      showApp();
    } else {
      showUserSetup();
    }
    renderVideos();
  }

  // User Management
  function loadCurrentUser() {
    try {
      const userId = localStorage.getItem(CURRENT_USER_KEY);
      if (!userId) return null;
      
      const users = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || '{}');
      return users[userId] || null;
    } catch (e) {
      return null;
    }
  }

  function saveUser(user) {
    try {
      const users = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || '{}');
      users[user.id] = user;
      localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
      localStorage.setItem(CURRENT_USER_KEY, user.id);
      currentUser = user;
    } catch (e) {
      console.error('Error saving user:', e);
    }
  }

  function createUser(name) {
    const id = 'user_' + Date.now();
    const user = {
      id,
      name,
      savedVideos: [],
      createdAt: new Date().toISOString()
    };
    saveUser(user);
    return user;
  }

  function toggleSaved(videoId) {
    if (!currentUser) return;
    
    const index = currentUser.savedVideos.indexOf(videoId);
    if (index > -1) {
      currentUser.savedVideos.splice(index, 1);
    } else {
      currentUser.savedVideos.push(videoId);
    }
    saveUser(currentUser);
    updateFavoriteBtn();
    renderVideos();
  }

  function isSaved(videoId) {
    return currentUser && currentUser.savedVideos.includes(videoId);
  }

  // UI Functions
  function showUserSetup() {
    userSetup.classList.add('active');
    app.classList.remove('active');
  }

  function showApp() {
    userSetup.classList.remove('active');
    app.classList.add('active');
    updateUserDisplay();
  }

  function updateUserDisplay() {
    if (currentUser) {
      const initials = currentUser.name.substring(0, 2).toUpperCase();
      document.getElementById('user-avatar').textContent = initials;
      document.getElementById('user-name').textContent = currentUser.name;
    }
  }

  function updateFavoriteBtn() {
    if (isSaved(currentVideoId)) {
      favoriteBtn.textContent = '💾 Saved';
      favoriteBtn.classList.add('favorited');
    } else {
      favoriteBtn.textContent = 'Save Video';
      favoriteBtn.classList.remove('favorited');
    }
  }

  function renderVideos() {
    // All videos
    videoGrid.innerHTML = VIDEOS.map(video => `
      <div class="video-card" onclick="playVideo(${video.id})">
        <div class="video-thumbnail">
          ${video.emoji}
          <div class="play-icon">▶️</div>
        </div>
        <div class="video-info">
          <p class="video-title">${video.title}</p>
          <p class="video-duration">${video.duration}</p>
        </div>
      </div>
    `).join('');

    // Saved videos
    if (currentUser && currentUser.savedVideos.length > 0) {
      const saved = VIDEOS.filter(v => currentUser.savedVideos.includes(v.id));
      savedGrid.innerHTML = saved.map(video => `
        <div class="video-card" onclick="playVideo(${video.id})">
          <div class="video-thumbnail">
            ${video.emoji}
            <div class="play-icon">▶️</div>
          </div>
          <div class="video-info">
            <p class="video-title">${video.title}</p>
            <p class="video-duration">${video.duration}</p>
          </div>
        </div>
      `).join('');
    } else {
      savedGrid.innerHTML = '<p style="color: var(--text-dim); font-size: 13px; grid-column: 1/-1;">No saved videos yet. Click any video to save!</p>';
    }
  }

  window.playVideo = function(videoId) {
    const video = VIDEOS.find(v => v.id === videoId);
    if (video) {
      currentVideoId = videoId;
      modalTitle.textContent = video.title;
      modalDesc.textContent = video.desc;
      modalVideo.src = video.videoUrl;
      updateFavoriteBtn();
      modal.classList.add('active');
    }
  };

  function closeModal() {
    modal.classList.remove('active');
    modalVideo.pause();
  }

  // Event Listeners
  setupStartBtn.addEventListener('click', () => {
    const name = setupNameInput.value.trim();
    if (name) {
      createUser(name);
      showApp();
      renderVideos();
    }
  });

  setupNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') setupStartBtn.click();
  });

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('k-study-current-user');
    currentUser = null;
    showUserSetup();
    setupNameInput.value = '';
  });

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  favoriteBtn.addEventListener('click', () => {
    toggleSaved(currentVideoId);
  });

  // Start app
  init();
</script>
</body>
</html>
